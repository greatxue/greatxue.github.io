---
layout: writing
---
<article>
    <header class="post-header">
        <h1>{{ page.title | escape }}</h1>
        <time class="meta" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    </header>
    <div class="post-body">
        {{ content }}
    </div>
</article>
