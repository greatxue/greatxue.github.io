<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' | escape }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
    {% if page.description and page.description != empty %}
    <meta name="description" content="{{ page.description | escape }}">
    {% endif %}
    <link rel="icon" type="image/png" sizes="194x194" href="{{ '/assets/logos/favicon.png' | relative_url }}">
    <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Spectral:wght@400;500;600&amp;display=swap">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% if page.url == '/blog/' %}
    <script src="{{ '/assets/writing-gallery.js' | relative_url }}" defer></script>
    {% endif %}
</head>
<body class="writing-page">
    <header class="site-header" lang="en">
        <a class="home-link" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        {% unless page.url == '/blog/' %}
        <a class="post-link" href="{{ '/blog/' | relative_url }}">[Notes]</a>
        {% endunless %}
    </header>
    <main>
        {{ content }}
    </main>
    <footer class="site-footer" lang="en">
        <p class="network-note">Content availability may vary by region and network conditions.</p>
    </footer>
</body>
</html>
